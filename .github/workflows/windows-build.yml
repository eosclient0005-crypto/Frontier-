name: Frontier Windows Build

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
    paths:
      - '.github/workflows/windows-build.yml'
      - 'CMakeLists.txt'
      - 'Automation/**'
      - 'Engine/**'
      - 'EngineContent/**'
      - 'Exhibits/**'
      - 'Projects/**'
      - 'ExternalPackages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build portable Frontier workspace package
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out branch source
        uses: actions/checkout@v4

      - name: Set up pinned build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache pinned Windows Ninja and sccache binaries
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/build-tools
          key: win-x64-tools-v1-ninja-1.13.2-sccache-0.20.1

      - name: Install Ninja and sccache
        id: build-tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ToolsDir = Join-Path $env:RUNNER_TEMP 'build-tools'
          New-Item -ItemType Directory -Force $ToolsDir | Out-Null
          $env:PATH = "$ToolsDir;$env:PATH"
          $ToolsDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          function Install-PinnedZipTool {
            param(
              [Parameter(Mandatory = $true)][string]$ToolName,
              [Parameter(Mandatory = $true)][string]$ExeName,
              [Parameter(Mandatory = $true)][string]$Url,
              [Parameter(Mandatory = $true)][string]$ExpectedSha256
            )
            $TargetExe = Join-Path $ToolsDir $ExeName
            if (Test-Path $TargetExe) {
              return $true
            }
            $ZipPath = Join-Path $env:RUNNER_TEMP "$ToolName-download.zip"
            $ExtractDir = Join-Path $env:RUNNER_TEMP "$ToolName-extract"
            for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
              try {
                Remove-Item -Path $ZipPath, $ExtractDir -Recurse -Force -ErrorAction SilentlyContinue
                Invoke-WebRequest -Uri $Url -OutFile $ZipPath -UseBasicParsing -TimeoutSec 120
                $ActualSha256 = (Get-FileHash -Path $ZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
                if ($ActualSha256 -ne $ExpectedSha256.ToLowerInvariant()) {
                  throw "SHA-256 mismatch for ${ToolName}: expected $ExpectedSha256, got $ActualSha256"
                }
                Expand-Archive -Path $ZipPath -DestinationPath $ExtractDir -Force
                $FoundExe = Get-ChildItem -Path $ExtractDir -Filter $ExeName -Recurse -File | Select-Object -First 1
                if (-not $FoundExe) {
                  throw "Extracted archive for $ToolName did not contain $ExeName"
                }
                Copy-Item -Path $FoundExe.FullName -Destination $TargetExe -Force
                return $true
              }
              catch {
                Write-Warning "Attempt $Attempt to install $ToolName failed: $($_.Exception.Message)"
                if ($Attempt -lt 3) {
                  Start-Sleep -Seconds 5
                }
              }
              finally {
                Remove-Item -Path $ZipPath, $ExtractDir -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
            return $false
          }

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $NinjaInstalled = Install-PinnedZipTool `
              -ToolName 'ninja' `
              -ExeName 'ninja.exe' `
              -Url 'https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip' `
              -ExpectedSha256 '07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65'
            if (-not $NinjaInstalled) {
              Write-Warning 'Direct Ninja release download failed; falling back to pip install ninja==1.13.2'
              & python -m pip install --no-cache-dir ninja==1.13.2
              if ($LASTEXITCODE -ne 0) {
                throw 'Failed to install Ninja via both GitHub Releases and pip.'
              }
            }
          }
          & ninja --version
          if ($LASTEXITCODE -ne 0) {
            throw 'ninja --version failed after installation.'
          }

          $UseSccache = 'false'
          if ((Get-Command sccache -ErrorAction SilentlyContinue) -or (Install-PinnedZipTool `
              -ToolName 'sccache' `
              -ExeName 'sccache.exe' `
              -Url 'https://github.com/mozilla/sccache/releases/download/v0.20.1/sccache-v0.20.1-x86_64-pc-windows-msvc.zip' `
              -ExpectedSha256 'ca500a01139e9af8d5f5a5e69b6a0dd941ed79ed3399a91cc35bba484fe732fa')) {
            try {
              & sccache --version
              if ($LASTEXITCODE -eq 0) {
                $SccacheDir = Join-Path $env:RUNNER_TEMP 'sccache'
                New-Item -ItemType Directory -Force $SccacheDir | Out-Null
                "SCCACHE_DIR=$SccacheDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                "SCCACHE_CACHE_SIZE=4G" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                $UseSccache = 'true'
              }
            }
            catch {
              Write-Warning "sccache unavailable after download; continuing without compiler cache: $($_.Exception.Message)"
            }
          }
          else {
            Write-Warning 'sccache download failed after retries; continuing without compiler cache.'
          }
          "use_sccache=$UseSccache" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache pinned native dependencies, fonts, and shader toolchain
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ExternalPackages
            EngineContent/FontsArchives
          key: win-x64-deps-v2-${{ hashFiles('Automation/**') }}

      - name: Cache sccache compiled object files
        if: steps.build-tools.outputs.use_sccache == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: win-x64-sccache-v1-${{ hashFiles('CMakeLists.txt', 'Engine/**/*.h', 'Engine/**/*.cpp', 'Projects/**/*.h', 'Projects/**/*.cpp') }}
          restore-keys: |
            win-x64-sccache-v1-

      - name: Install pinned font-generation dependency
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
            & python -m pip install --requirement Automation/FontRequirements.txt
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "Attempt $Attempt to install FontRequirements.txt failed (exit $LASTEXITCODE)"
            if ($Attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          exit 1

      - name: Recover pinned native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
            $Output = & python Automation/PrepareDependencies.py 2>&1
            $Result = $LASTEXITCODE
            $Output | ForEach-Object { Write-Output "$_" }
            if ($Result -eq 0) { exit 0 }
            Write-Warning "Attempt $Attempt of PrepareDependencies.py failed (exit $Result)"
            if ($Attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          $Details = ($Output | Select-Object -Last 12 | ForEach-Object { "$_" }) -join ' '
          Write-Output "::error title=Dependency preparation failed::$Details"
          exit 1

      - name: Prepare bundled fonts
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
            & python Automation/PrepareFonts.py
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "Attempt $Attempt of PrepareFonts.py failed (exit $LASTEXITCODE)"
            if ($Attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          exit 1

      - name: Install pinned Windows Slang compiler
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          for ($Attempt = 1; $Attempt -le 3; $Attempt++) {
            & python Automation/PrepareShaderToolchain.py
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "Attempt $Attempt of PrepareShaderToolchain.py failed (exit $LASTEXITCODE)"
            if ($Attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          exit 1

      - name: Configure Windows x64 Ninja build
        shell: pwsh
        run: |
          $CmakeArgs = @(
            '-S', '.', '-B', 'Build/Windows', '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_C_COMPILER=cl',
            '-DCMAKE_CXX_COMPILER=cl',
            '-DCMAKE_POLICY_DEFAULT_CMP0141=NEW',
            '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded',
            '-DFRONTIER_PROFILE=Editor',
            '-DBUILD_TESTING=OFF',
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          )
          if ('${{ steps.build-tools.outputs.use_sccache }}' -eq 'true') {
            $CmakeArgs += '-DCMAKE_C_COMPILER_LAUNCHER=sccache'
            $CmakeArgs += '-DCMAKE_CXX_COMPILER_LAUNCHER=sccache'
          }
          & cmake @CmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 Frontier, SolidArc, and AutoSpace applications
        shell: pwsh
        run: |
          $Output = & cmake --build Build/Windows --parallel 4 --target `
            Frontier FrontierSketcher AutoSpace `
            FrontierEngineRuntimeDll FrontierWorkspaceUiDll 2>&1
          $Result = $LASTEXITCODE
          $Output | ForEach-Object { Write-Output "$_" }
          if ('${{ steps.build-tools.outputs.use_sccache }}' -eq 'true') {
            & sccache --show-stats
          }
          if ($Result -ne 0) {
            $Diagnostics = $Output | Select-String -Pattern '(?i)(:\s*(?:fatal\s+)?error\b|LNK[0-9]+|FAILED|Build FAILED|MSB[0-9]+)' | Select-Object -Last 12
            if (-not $Diagnostics) { $Diagnostics = $Output | Select-Object -Last 10 }
            $Details = ($Diagnostics | ForEach-Object { "$_" }) -join ' '
            Write-Output "::error title=Windows build diagnostics::$Details"
            exit $Result
          }
          & 'Build/Windows/Projects/AutoSpace/AutoSpace.exe' --verify
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=AutoSpace verification failed::AutoSpace.exe --verify exited with $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $Payload = Join-Path $env:RUNNER_TEMP 'Frontier-Workspaces-Windows-x64'
          New-Item -ItemType Directory -Force "$Payload/CompiledShaders", "$Payload/EngineContent", "$Payload/Binaries/Win64" | Out-Null
          Copy-Item 'Build/Windows/Frontier.exe' "$Payload/Frontier.exe"
          Copy-Item 'Build/Windows/FrontierSketcher.exe' "$Payload/SolidArc.exe"
          Copy-Item 'Build/Windows/Binaries/Win64/*' "$Payload/Binaries/Win64/" -Recurse -Force
          Copy-Item 'Build/Windows/CompiledShaders/*' "$Payload/CompiledShaders/" -Recurse -Force
          Copy-Item 'EngineContent/*' "$Payload/EngineContent/" -Recurse -Force
          $RequiredPayload = @(
            "$Payload/Frontier.exe",
            "$Payload/SolidArc.exe",
            "$Payload/CompiledShaders/WorldViewportRadiometricCompute.comp.spv",
            "$Payload/EngineContent/FontsArchives/FontRepository.FontSpace",
            "$Payload/EngineContent/FontsArchives/Inter/Inter-Regular.otf"
          )
          foreach ($RequiredPath in $RequiredPayload) {
            if (-not (Test-Path $RequiredPath)) {
              Write-Error "Portable Windows package is missing required file: $RequiredPath"
              exit 1
            }
          }
          @'
          Frontier & SolidArc for Windows x64

          Executables included:
            - Frontier.exe : Project Browser, 3D World Editor & Integrated Workspaces
            - SolidArc.exe : Standalone Parametric B-Rep CAD & Sketching Studio

          Keep CompiledShaders, EngineContent, and Binaries/Win64 beside the executables.
          A Windows Vulkan 1.2+ graphics driver is required.
          '@ | Set-Content "$Payload/README.txt" -Encoding utf8
          Compress-Archive -Path "$Payload/*" -DestinationPath 'Build/Frontier-Workspaces-Windows-x64.zip' -CompressionLevel Optimal

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: Frontier-Workspaces-Windows-x64
          path: Build/Frontier-Workspaces-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
